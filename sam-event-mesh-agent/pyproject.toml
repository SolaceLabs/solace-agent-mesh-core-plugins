[build-system]
requires = ["hatchling<1.32"]  # 1.32 defaults core metadata to 2.5, which current PyPI upload tooling rejects
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.sam_event_mesh_agent.metadata]
type = "agent"

[project]
name = "sam_event_mesh_agent"
version = "0.1.1"
authors = [
  { name="SolaceLabs", email="solacelabs@solace.com" },
]
description = "This agent sends a message into event mesh and subscribes for a response"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
]
classifiers = [
    "Development Status :: 7 - Inactive",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sam_event_mesh_agent"]
src-path = "src"

[tool.hatch.build.targets.wheel.force-include]
"config.yaml" = "sam_event_mesh_agent/config.yaml"
"README.md" = "sam_event_mesh_agent/README.md"
"pyproject.toml" = "sam_event_mesh_agent/pyproject.toml"
